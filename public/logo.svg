<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" fill="none">
  <defs>
    <style>
      .brand-font { font-family: 'Cabinet Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Official NT Isotipo Mark -->
  <g transform="translate(20, 20) scale(0.38)">
    <rect x="60" y="50" width="70" height="380" rx="35" fill="#082041" />
    <path d="M95 50 L375 390 C392 410 388 438 368 452 C348 465 320 460 305 440 L35 110 C18 90 22 62 42 48 C62 35 90 40 95 50 Z" fill="#082041" />
    <rect x="180" y="50" width="260" height="70" rx="35" fill="#00A9A3" />
    <rect x="275" y="100" width="70" height="230" rx="35" fill="#00A9A3" />
  </g>

  <!-- Official NEXO TALENTO Wordmark -->
  <!-- N with teal accent upper-left corner -->
  <g transform="translate(230, 45)">
    <!-- Letter N -->
    <path d="M0 0 L25 0 L25 90 L0 90 Z" fill="#082041" />
    <path d="M0 0 L55 55 L35 75 L0 40 Z" fill="#00A9A3" />
    <path d="M35 35 L90 90 L65 90 L10 35 Z" fill="#082041" />
    <path d="M65 0 L90 0 L90 90 L65 90 Z" fill="#082041" />

    <!-- Letter E -->
    <path d="M125 0 L210 0 L210 22 L150 22 L150 35 L200 35 L200 55 L150 55 L150 68 L210 68 L210 90 L125 90 Z" fill="#082041" />

    <!-- Letter X -->
    <path d="M235 0 L262 0 L295 45 L328 0 L355 0 L310 45 L355 90 L328 90 L295 45 L262 90 L235 90 L280 45 Z" fill="#082041" />

    <!-- Letter O -->
    <path d="M420 0 C453 0 478 20 478 45 C478 70 453 90 420 90 C387 90 362 70 362 45 C362 20 387 0 420 0 Z M420 22 C402 22 388 32 388 45 C388 58 402 68 420 68 C438 68 452 58 452 45 C452 32 438 22 420 22 Z" fill="#082041" />

    <!-- TALENTO Subtitle -->
    <text x="5" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" letter-spacing="14" fill="#00A9A3">
      TALENTO
    </text>

    <!-- Tagline Divider & Description -->
    <line x1="5" y1="150" x2="480" y2="150" stroke="#00A9A3" stroke-width="2" />
    <circle cx="240" cy="150" r="5" fill="#00A9A3" />

    <text x="240" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#082041" text-anchor="middle">
      CONECTAMOS TALENTO CON OPORTUNIDADES EN LATAM Y ESPAÑA
    </text>
  </g>
</svg>
